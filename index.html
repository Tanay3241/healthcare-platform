<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PranaCare – Centralized Healthcare Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#162447;--teal:#12a594;--blue:#6b8cf0;--mint:#e4f6f1;--bg:#f3f6fb;--card:#fff;--coral:#f2a65a;--sun:#f7c98b;--mut:#7a879f;--line:#e6ebf3;--sh:#12a59422}
:root[data-theme=dark]{--ink:#e8eefc;--teal:#2dd4bf;--blue:#8fa9ff;--mint:#12363a;--bg:#0c1426;--card:#142038;--mut:#8f9db8;--line:#223152;--sh:#00000055}
*{box-sizing:border-box;margin:0}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
h1,h2,h3,.logo{font-family:Manrope,sans-serif;font-weight:800}
button{font:inherit;cursor:pointer;border:0;color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
/* login */
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;background:linear-gradient(135deg,var(--mint),var(--bg));color:var(--ink);overflow:hidden;position:relative}
.hero{padding:clamp(24px,6vw,72px);display:flex;flex-direction:column;justify-content:center;position:relative}
.logo{font-weight:700;font-size:1.4rem;display:flex;gap:10px;align-items:center}
.logo i{width:32px;height:32px;border-radius:10px;color:#fff;background:linear-gradient(135deg,#14b8a6,#5b8def);display:grid;place-items:center;font-style:normal;animation:beat 1.2s infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.22)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
.hero h1{font-size:clamp(2rem,4.6vw,3.6rem);line-height:1.08;margin:28px 0 14px;max-width:14ch}
.hero p{color:var(--mut);max-width:42ch}
.ecg{width:100%;height:120px;margin-top:36px}
.ecg path{fill:none;stroke:var(--teal);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 3.2s linear infinite;filter:drop-shadow(0 0 6px var(--teal))}
@keyframes draw{to{stroke-dashoffset:-900}}
.pick{background:var(--card);color:var(--ink);padding:clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:center;border-radius:36px 0 0 36px}
.pick h2{font-size:1.5rem}.pick>p{color:var(--mut);margin:4px 0 22px}
.roles{display:grid;gap:12px}
.role{display:flex;gap:14px;align-items:center;text-align:left;padding:14px 16px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;transition:.25s}
.role:hover{border-color:var(--teal);transform:translateX(6px);box-shadow:0 8px 24px var(--sh)}
.role b{display:block}.role small{color:var(--mut)}
.av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;background:var(--mint);flex:none}
/* app */
#app{display:none;min-height:100vh;grid-template-columns:250px 1fr}
aside{background:var(--card);color:var(--ink);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
aside .logo{margin:0 6px 18px}
.nav{display:flex;gap:12px;align-items:center;width:100%;padding:11px 12px;border-radius:12px;background:none;color:inherit;text-align:left;transition:.2s}
.nav:hover{background:var(--mint)}.nav.on{background:var(--mint);color:var(--teal);font-weight:700}
.sw{margin-top:auto;font-size:.85rem;color:var(--mut);padding:10px 12px;background:none;text-align:left}
main{padding:26px clamp(16px,3vw,40px) 60px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:1.6rem}.top p{color:var(--mut)}
.ibtn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700}.ibtn:hover{background:var(--mint)}.tr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.tl2{display:flex;gap:12px;align-items:center}#login .ibtn{position:absolute;top:18px;right:18px;z-index:2}
.chip{padding:6px 14px;border-radius:99px;background:var(--mint);font-weight:700;font-size:.85rem}
.view{animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.card h3{font-size:1.05rem;margin-bottom:12px}
.stat{font:800 2.2rem Manrope;color:var(--teal)}
.mut{color:var(--mut);font-size:.9rem}
.span2{grid-column:span 2}@media(max-width:700px){.span2{grid-column:auto}}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:700;background:var(--mint)}
.badge.warn{background:#ffe3a3;color:#5a3d00}.badge.bad{background:#ffd0ca;color:#7a1a10}
.tl{border-left:3px solid var(--mint);margin-left:8px;padding-left:22px;display:grid;gap:18px}
.tl div{position:relative}.tl div:before{content:"";position:absolute;left:-30px;top:5px;width:13px;height:13px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 4px var(--bg)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:8px 16px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.tab.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.bars{display:flex;gap:10px;align-items:flex-end;height:150px}
.bars div{flex:1;text-align:center;font-size:.75rem;color:var(--mut)}
.bars span{display:block;border-radius:8px 8px 0 0;background:linear-gradient(var(--blue),var(--teal));height:0;transition:height 1s cubic-bezier(.2,.8,.2,1);margin-bottom:4px}
.rings{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
.ring{text-align:center;font-size:.85rem}.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .t{stroke:var(--line)}.ring .v{stroke-dasharray:264;stroke-dashoffset:264;transition:stroke-dashoffset 1.2s ease}
.ring b{display:block;font-family:Manrope}
.rep{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;transition:.2s}
.rep:hover{transform:translateY(-3px);box-shadow:0 10px 26px var(--sh)}
.acc{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px}
.acc .more{max-height:0;overflow:hidden;transition:max-height .4s;color:var(--mut)}
.acc.on .more{max-height:200px;margin-top:10px}
.breath{width:140px;height:140px;border-radius:50%;margin:10px auto;background:radial-gradient(circle,#7ddccd,var(--teal));display:grid;place-items:center;color:#fff;font-weight:700;animation:br 8s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(.7)}50%{transform:scale(1.15)}}
table{width:100%;border-collapse:collapse;font-size:.92rem;display:block;overflow-x:auto}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}th:first-child,td:first-child{text-align:left}
dialog{border:0;border-radius:22px;padding:26px;max-width:440px;width:92%;background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0c1426aa;backdrop-filter:blur(4px)}
.btn{background:var(--teal);color:#fff;box-shadow:0 8px 18px var(--sh);padding:10px 18px;border-radius:12px;font-weight:700;margin-top:14px}
.meal{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px dashed var(--line)}
@media(max-width:860px){#login{grid-template-columns:1fr}.pick{border-radius:28px 28px 0 0}
#app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:12px}aside .logo,.sw{display:none}.nav{width:auto}}
[data-theme=dark] .tab.on,[data-theme=dark] .btn{color:#0c1426}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ecg path{stroke-dashoffset:0}}
</style>
</head>
<body>
<section id="login">
  <button class="ibtn tgl" aria-label="Toggle dark mode">🌙 Dark</button>
  <div class="hero">
    <div class="logo"><i>+</i>PranaCare</div>
    <h1>Every record. One heartbeat.</h1>
    <p>Profiles, reports, diets and yoga progress for patients and their care team, together in one place.</p>
    <svg class="ecg" viewBox="0 0 600 120"><path d="M0 70 H140 L160 70 L175 30 L195 105 L215 10 L235 70 H330 L345 55 L360 70 H600"/></svg>
  </div>
  <div class="pick">
    <h2>Sign in as</h2><p>Demo only. Pick a role to see what each person can access.</p>
    <div class="roles" id="roles"></div>
  </div>
</section>

<div id="app">
  <aside><div class="logo"><i>+</i>PranaCare</div><nav id="nav" style="display:contents"></nav><button class="sw" id="switch">Switch role</button></aside>
  <main>
    <div class="top"><div class="tl2"><button class="ibtn" id="back" aria-label="Go back">← Back</button><div><h1 id="title"></h1><p id="sub"></p></div></div><div class="tr"><button class="ibtn tgl" aria-label="Toggle dark mode">🌙 Dark</button><span class="chip" id="who"></span></div></div>
    <div id="view"></div>
  </main>
</div>
<dialog id="dlg"></dialog>

<script>
const $=s=>document.querySelector(s);
const ROLES={
 Admin:{ic:'🛡️',name:'Dr. Meera Nair',mods:['dash','profile','access'],d:'Manages users and permissions'},
 Doctor:{ic:'🩺',name:'Dr. Arjun Rao',mods:['dash','profile','history','reports','consult'],d:'Reviews history, reports and consultations'},
 Patient:{ic:'🙂',name:'Riya Sharma',mods:['dash','profile','history','reports','consult','nutri','yoga'],d:'Sees own records and plans'},
 Nutritionist:{ic:'🥗',name:'Kavya Menon',mods:['dash','profile','nutri'],d:'Builds personalised diet plans'},
 Yoga:{ic:'🧘',name:'Guru Devansh',mods:['dash','profile','yoga'],d:'Tracks yoga and wellness progress'}};
const MODS={dash:['🏠','Dashboard'],profile:['👤','Patient Profile'],history:['📜','Medical History'],reports:['🧪','Medical Reports'],consult:['💬','Consultations'],nutri:['🍎','Nutrition Plan'],yoga:['🧘','Yoga & Wellness'],access:['🔐','Role Access']};
const ROLENAMES={Yoga:'Yoga Instructor'};
let role,cur,hist=[];
const root=document.documentElement;
function setTheme(t){root.dataset.theme=t;document.querySelectorAll('.tgl').forEach(b=>b.textContent=t=='dark'?'☀️ Light':'🌙 Dark');try{localStorage.setItem('th',t)}catch(e){}}
let t0;try{t0=localStorage.getItem('th')}catch(e){}
setTheme(t0||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
document.querySelectorAll('.tgl').forEach(b=>b.onclick=()=>setTheme(root.dataset.theme=='dark'?'light':'dark'));
function toLogin(){$('#app').style.display='none';$('#login').style.display='grid';hist=[];cur=null}
$('#back').onclick=()=>hist.length?go(hist.pop(),false):toLogin();

$('#roles').innerHTML=Object.entries(ROLES).map(([k,r])=>`<button class="role" data-r="${k}"><span class="av">${r.ic}</span><span><b>${ROLENAMES[k]||k}</b><small>${r.d}</small></span></button>`).join('');
$('#roles').onclick=e=>{const b=e.target.closest('.role');if(b)enter(b.dataset.r)};
$('#switch').onclick=toLogin;

function enter(r){role=r;$('#login').style.display='none';$('#app').style.display='grid';
 $('#who').textContent=`${ROLES[r].ic} ${ROLES[r].name} · ${ROLENAMES[r]||r}`;
 $('#nav').innerHTML=ROLES[r].mods.map(m=>`<button class="nav" data-m="${m}"><span>${MODS[m][0]}</span>${MODS[m][1]}</button>`).join('');
 hist=[];cur=null;go('dash',false)}
$('#nav').onclick=e=>{const b=e.target.closest('.nav');if(b)go(b.dataset.m)};

function go(m,push=true){if(push&&cur&&cur!==m)hist.push(cur);cur=m;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.m===m));
 $('#title').textContent=MODS[m][1];$('#back').textContent=hist.length?'← Back':'← Roles';$('#sub').textContent={dash:'Today at a glance',profile:'One profile shared across the care team',history:'Conditions, surgeries and allergies over time',reports:'Tap a report to preview it',consult:'Notes from every visit',nutri:'Weekly diet plan from your nutritionist',yoga:'Sessions, streaks and breathing practice',access:'Who can see what'}[m];
 const v=$('#view');v.innerHTML=`<div class="view">${V[m]()}</div>`;after[m]&&after[m]();window.scrollTo(0,0)}

function count(){document.querySelectorAll('[data-n]').forEach(el=>{const t=+el.dataset.n,s=performance.now();(function f(n){const p=Math.min((n-s)/1000,1);el.textContent=Math.round(t*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(s)})}
const ring=(l,v,c,u)=>`<div class="ring"><svg viewBox="0 0 100 100"><circle class="t" cx="50" cy="50" r="42"/><circle class="v" data-p="${v}" cx="50" cy="50" r="42" stroke="${c}"/></svg><b>${u}</b>${l}</div>`;
function fill(){setTimeout(()=>{document.querySelectorAll('.v').forEach(c=>c.style.strokeDashoffset=264*(1-c.dataset.p/100));document.querySelectorAll('.bars span').forEach(s=>s.style.height=s.dataset.h+'%')},80)}

const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const V={
dash:()=>`<div class="grid">
 <div class="card"><div class="mut">Patients</div><div class="stat" data-n="1284">0</div><span class="badge">+42 this week</span></div>
 <div class="card"><div class="mut">Consultations today</div><div class="stat" data-n="36">0</div><span class="badge warn">6 pending</span></div>
 <div class="card"><div class="mut">Reports awaiting review</div><div class="stat" data-n="14">0</div><span class="badge bad">3 urgent</span></div>
 <div class="card"><div class="mut">Wellness score</div><div class="stat" data-n="86">0</div><span class="badge">Good</span></div>
 <div class="card span2"><h3>Yoga minutes this week</h3><div class="bars">${[30,45,20,50,40,60,35].map((h,i)=>`<div><span data-h="${h*1.6}"></span>${days[i]}</div>`).join('')}</div></div>
 <div class="card"><h3>Upcoming</h3>${[['10:30','Follow-up · Riya S.'],['11:15','Diet review · Amit K.'],['14:00','Yoga assessment · Neha P.']].map(a=>`<div class="meal"><b>${a[0]}</b><span>${a[1]}</span></div>`).join('')}</div></div>`,
profile:()=>`<div class="grid"><div class="card" style="text-align:center"><div class="av" style="width:90px;height:90px;font-size:2.6rem;margin:0 auto 10px;border-radius:50%">🙂</div><h3>Riya Sharma</h3><p class="mut">PID-20418 · 29 yrs · Female</p><span class="badge">Active</span></div>
 <div class="card span2"><h3>Vitals</h3><div class="rings">${ring('Heart rate',72,'#f2a65a','72 bpm')}${ring('SpO₂',98,'#12a594','98%')}${ring('BMI',62,'#ffc857','22.4')}${ring('Hydration',80,'#6b8cf0','2.4 L')}</div></div>
 <div class="card"><h3>Contact</h3><p>📞 +91 98765 43210<br>✉️ riya.sharma@mail.com<br>📍 Bhopal, MP</p></div>
 <div class="card"><h3>Care team</h3><p>🩺 Dr. Arjun Rao<br>🥗 Kavya Menon<br>🧘 Guru Devansh</p></div>
 <div class="card"><h3>Basics</h3><p>Blood group: <b>B+</b><br>Height: 162 cm · Weight: 59 kg</p></div></div>`,
history:()=>`<div class="card"><div class="tl">${[['Mar 2026','Seasonal allergic rhinitis','Started antihistamine course','warn'],['Nov 2025','Vitamin D deficiency','Supplement and morning sun routine','warn'],['Jun 2024','Appendectomy','Laparoscopic, full recovery','ok'],['Feb 2023','Mild hypertension','Diet and yoga plan, now stable','ok'],['2019','Penicillin allergy','Recorded as drug allergy','bad']].map(h=>`<div><span class="badge ${h[3]=='ok'?'':h[3]}">${h[0]}</span><h3 style="margin:6px 0 2px">${h[1]}</h3><span class="mut">${h[2]}</span></div>`).join('')}</div></div>`,
reports:()=>`<div class="tabs">${['All','Blood','Imaging','Cardio'].map((t,i)=>`<button class="tab ${i?'':'on'}" data-f="${t}">${t}</button>`).join('')}</div><div class="grid" id="replist"></div>`,
consult:()=>`${[['12 Oct 2026','Dr. Arjun Rao','Follow-up: blood pressure','BP 118/76. Continue current diet. Review in 3 months.'],['02 Sep 2026','Kavya Menon','Nutrition check','Added iron-rich foods. Reduced refined sugar.'],['18 Aug 2026','Guru Devansh','Yoga assessment','Shoulder mobility improved. Add 10 min pranayama.']].map(c=>`<button class="acc"><b>${c[2]}</b> <span class="badge">${c[0]}</span><div class="mut">with ${c[1]}</div><div class="more">${c[3]}</div></button>`).join('')}`,
nutri:()=>{return`<div class="grid"><div class="card span2"><h3>Daily targets</h3><div class="rings">${ring('Calories',74,'#f2a65a','1480')}${ring('Protein',60,'#12a594','48 g')}${ring('Carbs',82,'#ffc857','165 g')}${ring('Fats',45,'#6b8cf0','32 g')}</div></div>
 <div class="card"><h3>Notes</h3><p class="mut">Low sodium. Iron-rich foods. 2.5 L water a day.</p></div></div>
 <div class="tabs" style="margin-top:18px">${days.map((d,i)=>`<button class="tab ${i?'':'on'}" data-d="${i}">${d}</button>`).join('')}</div><div class="card" id="meals"></div>`},
yoga:()=>`<div class="grid"><div class="card" style="text-align:center"><h3>Breathe with the circle</h3><div class="breath">Inhale · Exhale</div><p class="mut">4 seconds in, 4 seconds out</p></div>
 <div class="card"><h3>Streak</h3><div class="stat"><span data-n="18">0</span> days</div><p class="mut">Best: 24 days</p><h3 style="margin-top:16px">Monthly goal</h3><div class="rings">${ring('18 of 25 sessions',72,'#12a594','72%')}</div></div>
 <div class="card span2"><h3>This week</h3><div class="bars">${[30,45,20,50,40,60,35].map((h,i)=>`<div><span data-h="${h*1.6}"></span>${days[i]}</div>`).join('')}</div></div>
 <div class="card span2"><h3>Poses practiced</h3>${[['Surya Namaskar',90],['Vrikshasana',70],['Bhujangasana',55],['Shavasana',100]].map(p=>`<div class="meal"><span>${p[0]}</span><span class="badge">${p[1]}% mastery</span></div>`).join('')}</div></div>`,
access:()=>{const P={Admin:[1,0,0,0,0,0,1],Doctor:[1,1,1,1,0,0,0],Patient:[1,1,1,1,1,1,0],Nutritionist:[1,0,0,0,1,0,0],Yoga:[1,0,0,0,0,1,0]},H=['Profile','History','Reports','Consults','Nutrition','Yoga','User admin'];
 return`<div class="card"><table><tr><th>Role</th>${H.map(h=>`<th>${h}</th>`).join('')}</tr>${Object.entries(P).map(([r,a])=>`<tr><td><b>${ROLENAMES[r]||r}</b></td>${a.map(x=>`<td>${x?'✅':'—'}</td>`).join('')}</tr>`).join('')}</table></div>
 <div class="card" style="margin-top:16px"><h3>Users</h3>${Object.entries(ROLES).map(([k,r])=>`<div class="meal"><span>${r.ic} ${r.name}</span><span class="badge">${ROLENAMES[k]||k}</span></div>`).join('')}</div>`}
};

const REPORTS=[['Complete Blood Count','Blood','12 Oct 2026','ok','Hemoglobin 12.8 g/dL, WBC 6.4, Platelets 240'],['Lipid Profile','Blood','12 Oct 2026','warn','LDL 138 mg/dL, slightly high. HDL 52.'],['Chest X-Ray','Imaging','03 Sep 2026','ok','No abnormality detected.'],['ECG','Cardio','03 Sep 2026','ok','Normal sinus rhythm, 72 bpm.'],['Vitamin D','Blood','20 Nov 2025','bad','22 ng/mL, low. Supplement advised.'],['Echocardiogram','Cardio','14 Aug 2025','ok','EF 60%, normal valves.']];
const MEALS=[['Breakfast','Vegetable poha, green tea','320 kcal'],['Snack','Sprouts chaat and fruit','150 kcal'],['Lunch','2 roti, dal, palak sabzi, curd','520 kcal'],['Evening','Roasted chana, buttermilk','120 kcal'],['Dinner','Moong khichdi, salad','370 kcal']];
const after={
dash:()=>{count();fill()},profile:()=>fill(),yoga:()=>{count();fill()},
reports:()=>{const draw=f=>{$('#replist').innerHTML=REPORTS.filter(r=>f=='All'||r[1]==f).map((r,i)=>`<button class="rep" data-i="${REPORTS.indexOf(r)}"><span class="av">📄</span><span><b>${r[0]}</b><br><small class="mut">${r[2]}</small></span><span class="badge ${r[3]=='ok'?'':r[3]}" style="margin-left:auto">${{ok:'Normal',warn:'Review',bad:'Abnormal'}[r[3]]}</span></button>`).join('')};draw('All');
 $('.tabs').onclick=e=>{const t=e.target.closest('.tab');if(!t)return;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x==t));draw(t.dataset.f)};
 $('#replist').onclick=e=>{const b=e.target.closest('.rep');if(!b)return;const r=REPORTS[b.dataset.i];$('#dlg').innerHTML=`<h3>${r[0]}</h3><p class="mut">${r[2]} · ${r[1]}</p><p style="margin-top:12px">${r[4]}</p><button class="btn" onclick="dlg.close()">Close</button>`;$('#dlg').showModal()}},
consult:()=>{$('#view').onclick=e=>{const a=e.target.closest('.acc');if(a)a.classList.toggle('on')}},
nutri:()=>{fill();const show=i=>{$('#meals').innerHTML=`<h3>${days[i]} plan</h3>`+MEALS.map(m=>`<div class="meal"><span><b>${m[0]}</b><br><span class="mut">${m[1]}</span></span><span class="badge">${m[2]}</span></div>`).join('')};show(0);
 $('.tabs').onclick=e=>{const t=e.target.closest('.tab');if(!t)return;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x==t));show(+t.dataset.d)}}
};
const dlg=$('#dlg');
</script>
</body>
</html>
